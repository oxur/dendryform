[package]
name = "dendryform-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI binary for dendryform — render architecture diagrams from YAML"
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "dendryform"
path = "src/main.rs"

[features]
default = ["bundled-fonts"]
bundled-fonts = ["dendryform-png/bundled-fonts"]

[dependencies]
dendryform-core.workspace = true
dendryform-parse.workspace = true
dendryform-layout.workspace = true
dendryform-html.workspace = true
dendryform-svg.workspace = true
dendryform-png = { workspace = true }
clap.workspace = true
serde_yml.workspace = true
